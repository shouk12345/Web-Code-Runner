
name: Deploy
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      #タッグをもとにインスタンスIDを探す
      - name: Get instance ID by tag
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=code-runner-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
 
          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::No running instance found with tag Name=code-runner-server. Is the EC2 instance currently on?"
            exit 1
          fi
 
          echo "Found instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      #デプロイ前にSSMエージェントがAWSと通信可能かヘルスチェック
      - name: Pre-deploy health check (SSM agent online?)
        run: |
          PING_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds, values=${{steps.get-instance.outputs.instance_id}}" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text)

            echo "SSM Ping status : $PING_STATUS"
 
          if [ "$PING_STATUS" != "Online" ]; then
            echo "::error::SSM agent is not Online (status : $PING_STATUS). Deployment cannot proceed."
            exit 1
          fi
      # Deploy Step
      # 以降'cd _/Web-Code-Runner && git pull && npm ci && pm2 restart code-runner-api'に交替予定
      - name: Deploy (placeholder)
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo hello from GitHub Actions > /tmp/deploy-test.txt", "date >> /tmp/deploy-test.txt"]' \
            --query "Command.CommandId" --output text)

            echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
            echo "Sent command: $COMMAND_ID"

      # Post-deploy smoke test
      # send-commandの命令が成功的にEC2に届いたか確認
      # SSMは命令を非同期式で実行するため、状態が出るまで少しの間が必要
      - name: Post-deploy smoke test (verify command succeeded)
        run: |
          INSTANCE_ID="${{ steps.get-instance.outputs.instance_id }}"
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          # 命令が完了するまで最大30秒待機(2秒間隔でプール)
          for i in $(seq 1 15); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"\
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: status=$STATUS"

            if [ "$STATUS" == "Success" ]; then
              echo "Smoke test passed: command executed successfully."
              exit 0
            fi

            if["$STATUS" == "Failed"] || ["$STATUS" == "Cancelled"] || ["$STATUS" == "TimeOut"]; then
              echo "::error::Deploy command finished with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1
            fi


            sleep 2
          done
        
          echo "::error::Timed out waiting for command to complete"
          exit 1
                
          